<style>
  :root { --green:#004030; --gold:#D8C3A5; --line:#E3D9C5; --ok:#2f7d4f; --warn:#b3261e; }
  html, body { background:#f4f4f4; }
  .dark body { background:#121212; color:#e5e5e5; }
  ::selection { background:#004030; color:#fff; }
  .dark ::selection { background:#D8C3A5; color:#004030; }
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:10px; }
  .dark ::-webkit-scrollbar-thumb { background:#475569; }
  @keyframes fadeInUp { from{opacity:0;transform:translateY(15px)} to{opacity:1;transform:translateY(0)} }
  .animate-fade-in { animation: fadeInUp .5s ease-out forwards; }

  /* ---------- 晨報排版 ---------- */
  #brief { line-height:1.85; }
  #brief > h1 { font-family:Merriweather,serif; font-weight:900; font-size:1.6rem; color:var(--green); margin:0 0 .75rem; }
  .dark #brief > h1 { color:var(--gold); }
  #brief h2 { font-family:Merriweather,serif; font-weight:900; font-size:1.25rem; color:#fff; background:var(--green);
              padding:.55rem 1rem; border-radius:.6rem; margin:2rem 0 1rem; scroll-margin-top:6.8rem; }
  .dark #brief h2 { background:var(--gold); color:var(--green); }
  .card { background:#fff; border:1px solid var(--line); border-left:4px solid var(--green); border-radius:.8rem;
          padding:1rem 1.15rem; margin:0 0 .9rem; }
  .dark .card { background:#1a2520; border-color:#2a3d35; border-left-color:var(--gold); }
  .card h3 { font-family:Merriweather,serif; font-weight:700; font-size:1.02rem; color:var(--green); margin:0 0 .5rem; }
  .dark .card h3 { color:var(--gold); }
  #brief ul { padding-left:1.1rem; list-style:disc; margin:.4rem 0; }
  #brief li { margin:.25rem 0; font-size:.92rem; }
  #brief a { color:var(--green); text-decoration:underline; text-underline-offset:2px; word-break:break-all; }
  .dark #brief a { color:var(--gold); }
  #brief blockquote { border-left:3px solid var(--gold); background:rgba(216,195,165,.12); padding:.6rem .9rem;
                      border-radius:.4rem; margin:.8rem 0; font-size:.92rem; }
  #brief table { width:100%; border-collapse:collapse; font-size:.85rem; margin:.8rem 0; }
  #brief th { background:var(--green); color:var(--gold); padding:.5rem .6rem; text-align:left; white-space:nowrap; }
  #brief td { border-bottom:1px solid var(--line); padding:.45rem .6rem; }
  .dark #brief td { border-color:#2a3d35; }
  .tbl-wrap { overflow-x:auto; }
  #brief hr { border:0; border-top:1px dashed var(--line); margin:1.5rem 0; }
  /* Emphasis is always rendered as real bold -- see EMPHASIS_BUDGET for how much
     of a document is allowed to carry it. Restyling dense emphasis (lighter
     weight, tint) was the wrong lever: it repainted the same 63% of the text
     instead of reducing how much was painted. */
  #brief strong { color:var(--green); }
  .dark #brief strong { color:var(--gold); }
  /* Runs demoted by the budget read as ordinary body text. */
  #brief strong.de-emphasised, #brief b.de-emphasised { font-weight:400; color:inherit; }

  /* Date picker: a native <select> cannot collapse groups, and a flat list of
     every issue ever published stops scaling once the archive spans months.
     Months are collapsible; the newest month opens by default. */
  .dpick { position:relative; }
  .dpick-btn { display:flex; align-items:center; gap:.35rem; background:rgba(255,255,255,.1); color:#fff;
               font:inherit; font-size:.875rem; border:1px solid rgba(255,255,255,.2); border-radius:.5rem;
               padding:.375rem .5rem; cursor:pointer; white-space:nowrap; }
  .dpick-btn:hover { background:rgba(255,255,255,.18); }
  .dpick-caret { font-size:.65rem; opacity:.85; transition:transform .15s; }
  .dpick[data-open="1"] .dpick-caret { transform:rotate(180deg); }
  .dpick-menu { position:absolute; right:0; top:calc(100% + .4rem); z-index:60; min-width:13rem;
                max-height:min(70vh,26rem); overflow-y:auto; padding:.3rem;
                background:#fff; color:#333; border:1px solid var(--line); border-radius:.6rem;
                box-shadow:0 10px 30px rgba(0,0,0,.18); }
  .dark .dpick-menu { background:#16211d; color:#e8e4dc; border-color:#2a3d35; }
  .dpick-group { width:100%; display:flex; align-items:center; justify-content:space-between; gap:.6rem;
                 background:transparent; border:0; cursor:pointer; font:inherit; font-size:.82rem; font-weight:700;
                 color:var(--green); padding:.45rem .55rem; border-radius:.4rem; text-align:left; }
  .dark .dpick-group { color:var(--gold); }
  .dpick-group:hover { background:rgba(0,64,48,.07); }
  .dark .dpick-group:hover { background:rgba(216,195,165,.12); }
  .dpick-arrow { display:inline-block; font-size:.6rem; opacity:.7; transition:transform .15s; margin-right:.3rem; }
  .dpick-group[aria-expanded="true"] .dpick-arrow { transform:rotate(90deg); }
  .dpick-count { font-weight:400; opacity:.55; font-size:.75rem; }
  .dpick-sub { padding:.05rem 0 .3rem .55rem; }
  .dpick-item { width:100%; text-align:left; background:transparent; border:0; cursor:pointer; font:inherit;
                font-size:.84rem; padding:.4rem .55rem; border-radius:.4rem; color:inherit; }
  .dpick-item:hover { background:rgba(0,64,48,.07); }
  .dark .dpick-item:hover { background:rgba(216,195,165,.12); }
  .dpick-item[aria-current="true"] { background:var(--green); color:#fff; font-weight:700; }
  .dark .dpick-item[aria-current="true"] { background:var(--gold); color:#04231b; }
  /* ---------- 語音導覽 ---------- */
  .tts-btn { display:inline-flex; align-items:center; justify-content:center; width:1.55em; height:1.55em;
             margin-left:.4em; padding:0; border:1px solid var(--line); border-radius:999px; background:transparent;
             color:var(--green); font-size:.72em; line-height:1; cursor:pointer; vertical-align:.1em;
             flex:0 0 auto; transition:background .15s; }
  /* 刻意不對 border-color 做 transition：主題切換應即時，過渡也會讓樣式難以驗證 */
  .dark .tts-btn { color:var(--gold); border-color:#2a3d35; }
  .tts-btn:hover { background:rgba(0,64,48,.10); border-color:var(--green); }
  .dark .tts-btn:hover { background:rgba(216,195,165,.14); border-color:var(--gold); }
  .tts-btn[aria-pressed="true"] { background:var(--green); color:#fff; border-color:var(--green); }
  .dark .tts-btn[aria-pressed="true"] { background:var(--gold); color:#04231b; border-color:var(--gold); }
  /* 正在朗讀的段落 */
  #brief .tts-now { background:rgba(0,64,48,.09); border-radius:.25em; box-shadow:0 0 0 .28em rgba(0,64,48,.09); }
  .dark #brief .tts-now { background:rgba(216,195,165,.14); box-shadow:0 0 0 .28em rgba(216,195,165,.14); }
  /* 迷你播放器：固定於底部，不影響既有版面（僅在播放時以 body class 補上底部留白） */
  #ttsPlayer { position:fixed; left:0; right:0; bottom:0; z-index:45; padding:.5rem .75rem;
               background:#fff; border-top:1px solid var(--line); box-shadow:0 -6px 20px rgba(0,0,0,.12); }
  .dark #ttsPlayer { background:#16211d; border-top-color:#2a3d35; }
  #ttsPlayer .tp-inner { max-width:48rem; margin:0 auto; display:flex; align-items:center; gap:.5rem; }
  #ttsPlayer .tp-b { flex:0 0 auto; width:2.1rem; height:2.1rem; display:flex; align-items:center; justify-content:center;
                     border:1px solid var(--line); border-radius:.5rem; background:transparent; color:var(--green);
                     font-size:.9rem; cursor:pointer; }
  .dark #ttsPlayer .tp-b { color:var(--gold); border-color:#2a3d35; }
  #ttsPlayer .tp-b:hover { background:rgba(0,64,48,.08); }
  .dark #ttsPlayer .tp-b:hover { background:rgba(216,195,165,.12); }
  #ttsPlayer .tp-label { flex:1 1 auto; min-width:0; font-size:.78rem; line-height:1.25;
                         overflow:hidden; text-overflow:ellipsis; white-space:nowrap; opacity:.85; }
  #ttsPlayer .tp-count { flex:0 0 auto; font-size:.72rem; opacity:.6; font-variant-numeric:tabular-nums; }
  #ttsPlayer .tp-rate { flex:0 0 auto; font-size:.75rem; padding:.25rem .3rem; border-radius:.4rem;
                        border:1px solid var(--line); background:transparent; color:inherit; }
  .dark #ttsPlayer .tp-rate { border-color:#2a3d35; background:#16211d; }
  .tts-hint { display:block; font-size:.7rem; opacity:.6; font-weight:400; margin-top:.12rem; }
  .tts-tip { padding:.35rem .55rem .15rem; border-top:1px solid var(--line); margin-top:.25rem; }
  .dark .tts-tip { border-top-color:#2a3d35; }
  #ttsMenu .dpick-item { line-height:1.35; padding:.5rem .55rem; }
  body.tts-on { padding-bottom:3.6rem; }
  @media (max-width:420px){ #ttsPlayer .tp-label { font-size:.72rem; } #ttsPlayer .tp-count { display:none; } }
  .badge { display:inline-block; padding:.1rem .55rem; border-radius:999px; font-size:.72rem; font-weight:700; vertical-align:.08rem; margin:0 .18rem 0 0; white-space:nowrap; }
  .badge-verify { background:#f5e3c8; color:#8a5a00; border:1px solid #e2b96f; }
  .dark .badge-verify { background:#3d3020; color:#e2b96f; border-color:#8a5a00; }
  .badge-update { background:#e2f2e8; color:#1d5c38; border:1px solid #7fc39a; }
  .dark .badge-update { background:#15301f; color:#7fc39a; border-color:#1d5c38; }
  .badge-new { background:#e8eef9; color:#274b8f; border:1px solid #8aa5d6; }
  .dark .badge-new { background:#182338; color:#8aa5d6; border-color:#274b8f; }
  .badge-domain { background:rgba(0,64,48,.08); color:var(--green); border:1px solid rgba(0,64,48,.25); }
  .dark .badge-domain { background:rgba(216,195,165,.10); color:var(--gold); border-color:rgba(216,195,165,.35); }

  .disclaimer { border:1.5px solid var(--gold); background:rgba(216,195,165,.15); border-radius:.7rem; padding:.8rem 1rem;
                font-size:.85rem; margin:.6rem 0 1rem; }

  /* 摺疊區（產製說明、決策行動） */
  details.fold { border:1px solid var(--line); border-radius:.7rem; margin:.8rem 0 1rem; background:rgba(216,195,165,.06); }
  .dark details.fold { border-color:#2a3d35; }
  details.fold > summary { cursor:pointer; padding:.65rem 1rem; font-weight:700; font-size:.9rem; color:var(--green);
                           list-style:none; display:flex; align-items:center; gap:.5rem; user-select:none; }
  .dark details.fold > summary { color:var(--gold); }
  details.fold > summary::-webkit-details-marker { display:none; }
  details.fold > summary::before { content:'▸'; transition:transform .2s; }
  details.fold[open] > summary::before { transform:rotate(90deg); }
  details.fold > .fold-body { padding:0 1rem .8rem; }
  details.fold .disclaimer { margin-top:.2rem; }

  /* 主題滑軸 */
  #topicNav { position:fixed; top:3.5rem; left:0; right:0; z-index:40; border-bottom:1px solid var(--line); }
  .dark #topicNav { border-color:#2a3d35; }
  #topicNav .rail-outer { position:relative; max-width:48rem; margin:0 auto; }
  #topicNav .rail { display:flex; gap:.5rem; overflow-x:auto; padding:.5rem 1.6rem; scrollbar-width:none; scroll-behavior:smooth; }
  #topicNav .rail::-webkit-scrollbar { display:none; }
  /* 左右邊緣漸層＋箭頭：提示還有更多主題可滑 */
  #topicNav .edge { position:absolute; top:0; bottom:0; width:2rem; pointer-events:none; display:flex; align-items:center;
                    font-size:.9rem; color:var(--green); opacity:.75; z-index:2; }
  .dark #topicNav .edge { color:var(--gold); }
  #topicNav .edge-l { left:0; justify-content:flex-start; padding-left:.15rem;
    background:linear-gradient(to right, #f4f4f4 35%, transparent); }
  #topicNav .edge-r { right:0; justify-content:flex-end; padding-right:.15rem;
    background:linear-gradient(to left, #f4f4f4 35%, transparent); }
  .dark #topicNav .edge-l { background:linear-gradient(to right, #121212 35%, transparent); }
  .dark #topicNav .edge-r { background:linear-gradient(to left, #121212 35%, transparent); }
  #topicNav .edge.hide { display:none; }

  .chip { padding:.3rem .8rem; border-radius:999px; border:1.5px solid var(--line); font-size:.8rem; white-space:nowrap;
          cursor:pointer; background:#fff; transition:all .15s; }
  .dark .chip { background:#1a2520; border-color:#2a3d35; }
  .chip:hover { border-color:var(--green); }
  .dark .chip:hover { border-color:var(--gold); }
  .chip.active { background:var(--green); color:#fff; border-color:var(--green); font-weight:700; }
  .dark .chip.active { background:var(--gold); color:var(--green); border-color:var(--gold); }

  /* 防禦：僅 UI 裝飾禁選取；正文（#brief）保持可反白、可複製 */
  header, footer, button, select, .chip { -webkit-user-select:none; user-select:none; }
</style>
</head>
<body class="font-sans text-slate-800 dark:text-slate-200">
<script>
(function(){
  var ALLOWED = ['localhost','127.0.0.1','lolopodcast.github.io'];
  var isFile = location.protocol === 'file:';
  if (!isFile && !ALLOWED.some(function(d){ return location.hostname === d || location.hostname.endsWith('.'+d); })) {
    document.body.innerHTML = '<div style="text-align:center;padding:60px;font-family:sans-serif"><h1>Access Denied</h1></div>';
    return;
  }
  if (window.self !== window.top) { try { window.top.location.href = window.self.location.href; } catch(e) {} }
})();
// 智慧型前端防禦（防君子、護閱讀）：文字可選可複製、Ctrl+P/S 開放；
// 圖片/空白處右鍵與開發者工具快捷鍵 → 優雅版權提示
(function(){
  var toastTimer = null;
  function showToast(msg){
    var el = document.getElementById('_copyright_toast');
    if (el) el.remove();
    el = document.createElement('div');
    el.id = '_copyright_toast';
    el.textContent = msg || '© Intellectual Property of Prof. Shihmin Lo';
    el.style.cssText = 'position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#004030;color:#D8C3A5;padding:12px 24px;border-radius:10px;font-size:13px;font-family:Inter,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:9999;pointer-events:none;';
    document.body.appendChild(el);
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.remove(); }, 2200);
  }
  document.addEventListener('contextmenu', function(e){
    var selection = window.getSelection().toString().trim();
    if (selection.length > 0) return true;   // 有反白 → 允許右鍵（查字典/複製筆記）
    var isImage = e.target.tagName === 'IMG' || e.target.closest('svg');
    e.preventDefault();
    showToast(isImage ? '© Image protected · Prof. Shihmin Lo' : undefined);
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'F12') { e.preventDefault(); showToast(); return; }
    if (e.ctrlKey && e.key && e.key.toLowerCase() === 'u') { e.preventDefault(); showToast(); return; }
    if (e.ctrlKey && e.shiftKey && ['i','j','c'].indexOf((e.key||'').toLowerCase()) !== -1) { e.preventDefault(); showToast(); return; }
    // Ctrl+P（列印）與 Ctrl+S（存檔）維持開放——晨報本就歡迎離線保存
  });
  document.addEventListener('dragstart', function(e){
    if (e.target.tagName === 'IMG' || e.target.closest('svg')) e.preventDefault();
  });
})();
</script>

<script>
(function(){
  var state = { dark: localStorage.getItem('brief_theme') !== 'light', sections: [] };
  function applyTheme(){ document.documentElement.classList.toggle('dark', state.dark); }
  applyTheme();
  document.getElementById('themeBtn').addEventListener('click', function(){
    state.dark = !state.dark; localStorage.setItem('brief_theme', state.dark ? 'dark' : 'light'); applyTheme();
  });

  function badge(cls, text){ return '<span class="badge ' + cls + '">' + text + '</span>'; }

  // 〔…〕標籤 → 徽章（統一規則：新舊主題一視同仁）
  function tagBadges(html){
    return html
      .replace(/〔對昨日的實質更新〕/g, badge('badge-update','較昨日更新'))
      .replace(/〔巡檢基線〕/g, badge('badge-new','基線'))
      .replace(/〔昨日待查核項目的進度追蹤〕/g, badge('badge-new','追蹤'))
      .replace(/〔新增[．·]?([^〕]*)〕/g, function(m, extra){
        var b = badge('badge-new','新增');
        if (extra && extra.trim()) b += badge('badge-new', extra.trim().slice(0,10));
        return b;
      })
      .replace(/〔([^〕]{1,12})〕/g, function(m, inner){ return badge('badge-new', inner); });
  }

  // （空）（海）（陸＋海）… → 領域徽章
  function domainBadges(html){
    return html.replace(/（([陸海空][陸海空＋+、\/／\s]*)）/g, function(m, inner){
      var map = { '空':'✈️ 空', '海':'⚓ 海', '陸':'🚙 陸' };
      var out = '';
      inner.replace(/[陸海空]/g, function(ch){ out += badge('badge-domain', map[ch]); return ch; });
      return ' ' + out;
    });
  }

  function enhance(container){
    // 0) 標題品牌化（相容舊晨報標題）
    var h1 = container.querySelector('h1');
    if (h1) h1.textContent = h1.textContent.replace(/每日主題晨報|駱駱精選晨報/, '駱駱精選晨報');

    // 1) 產製說明（h1 與第一個 h2 之間的中繼資料）→ 摺疊
    if (h1) {
      var meta = [], n = h1.nextElementSibling;
      while (n && n.tagName !== 'H2') { var nx = n.nextElementSibling; meta.push(n); n = nx; }

  // An issue may emphasise at most this share of its rendered characters. 07-31
  // (19.4%) is the reference for emphasis that still reads as emphasis, so the
  // budget sits at its level; issues under the SOP's 8% source cap land ~12%
  // here and are never touched.
  //
  // When a document is over budget, the runs that get demoted are the LONG ones.
  // That is where the drift lives: median run length is 9 characters on 07-31 but
  // 29 on 08-07, whose longest single bold run is 220 characters -- entire
  // paragraphs set in bold. Short runs are keywords, figures and dates and carry
  // real information; long runs are whole sentences and are what turns a page
  // into a wall. So we keep every run up to the longest length the budget can
  // afford, and demote the rest.
  var EMPHASIS_BUDGET = 0.20;
  function applyEmphasisMode(el){
    var runs = Array.prototype.slice.call(el.querySelectorAll('strong, b'));
    var total = el.textContent.replace(/\s/g, '').length;
    runs.forEach(function(s){ s.classList.remove('de-emphasised'); });
    if (!total || !runs.length) return;

    var lens = runs.map(function(s){ return s.textContent.replace(/\s/g, '').length; });
    var marked = lens.reduce(function(a, c){ return a + c; }, 0);
    el.dataset.boldRatio = (marked / total * 100).toFixed(1);
    delete el.dataset.emphasisLimit;                    // never carry the previous issue's numbers over
    delete el.dataset.boldRatioKept;
    if (marked <= total * EMPHASIS_BUDGET) return;      // already sparse enough

    // largest run length whose whole cohort still fits the budget
    var budget = total * EMPHASIS_BUDGET;
    var sizes = lens.slice().sort(function(a, b){ return a - b; });
    var distinct = sizes.filter(function(v, i){ return i === 0 || v !== sizes[i - 1]; });
    var limit = 0;
    for (var i = 0; i < distinct.length; i++) {
      var sum = 0;
      for (var j = 0; j < sizes.length && sizes[j] <= distinct[i]; j++) sum += sizes[j];
      if (sum > budget) break;
      limit = distinct[i];
    }

    var kept = 0;
    runs.forEach(function(s, k){
      if (lens[k] > limit) s.classList.add('de-emphasised'); else kept += lens[k];
    });
    el.dataset.emphasisLimit = limit;
    el.dataset.boldRatioKept = (kept / total * 100).toFixed(1);
  }
  function loadBrief(file){
    var el = document.getElementById('brief');

      window.scrollTo({top:0});
    }).catch(function(e){
      el.innerHTML = '<p class="py-10 text-center">載入失敗（' + e.message + '）。離線時僅能閱讀造訪過的晨報。</p>';
    });
  }

  fetch('briefs/manifest.json', {cache:'no-cache'}).then(function(r){ return r.json(); }).then(function(m){
    var briefs = m.briefs || [];
    if (!briefs.length) {
      document.getElementById('brief').innerHTML = '<p class="py-10 text-center opacity-60">尚無晨報。</p>';
      return;
    }
    var pick = document.getElementById('datePick');
    var btn  = pick.querySelector('.dpick-btn');
    var lbl  = pick.querySelector('.dpick-label');
    var menu = pick.querySelector('.dpick-menu');

    // group by YYYY-MM, keeping the manifest's newest-first order
    var months = [], byMonth = {};
    briefs.forEach(function(b){
      var key = b.date.slice(0, 7);
      if (!byMonth[key]) { byMonth[key] = []; months.push(key); }
      byMonth[key].push(b);
    });

    function setOpen(open){
      pick.dataset.open = open ? '1' : '0';
      menu.hidden = !open;
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function select(b, isNewest){
      lbl.textContent = b.date + (isNewest ? '（最新）' : '');
      Array.prototype.forEach.call(menu.querySelectorAll('.dpick-item'), function(el){
        el.setAttribute('aria-current', el.dataset.file === b.file ? 'true' : 'false');
      });
      loadBrief(b.file);
    }

    months.forEach(function(key, mi){
      var group = document.createElement('button');
      group.type = 'button';
      group.className = 'dpick-group';
      group.setAttribute('aria-expanded', mi === 0 ? 'true' : 'false');
      group.innerHTML = '<span><span class="dpick-arrow">▶</span>' + key + '</span>' +
                        '<span class="dpick-count">' + byMonth[key].length + ' 期</span>';

      var sub = document.createElement('div');
      sub.className = 'dpick-sub';
      sub.hidden = (mi !== 0);              // only the newest month starts open

      byMonth[key].forEach(function(b){
        var isNewest = (b.file === briefs[0].file);
        var item = document.createElement('button');
        item.type = 'button';
        item.className = 'dpick-item';
        item.dataset.file = b.file;
        item.textContent = b.date + (isNewest ? '（最新）' : '');
        item.addEventListener('click', function(){ select(b, isNewest); setOpen(false); });
        sub.appendChild(item);
      });

      group.addEventListener('click', function(){
        var nowOpen = group.getAttribute('aria-expanded') !== 'true';
        group.setAttribute('aria-expanded', nowOpen ? 'true' : 'false');
        sub.hidden = !nowOpen;
      });

      menu.appendChild(group);
      menu.appendChild(sub);
    });

    btn.addEventListener('click', function(e){
      e.stopPropagation();
      setOpen(pick.dataset.open !== '1');
    });
    document.addEventListener('click', function(e){ if (!pick.contains(e.target)) setOpen(false); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') setOpen(false); });

    select(briefs[0], true);
  }).catch(function(){
    document.getElementById('brief').innerHTML = '<p class="py-10 text-center">無法載入晨報清單。</p>';
  });

  // ---------- 語音導覽：控制項綁定 ----------
  (function(){
    var pick = document.getElementById('ttsPick');
    var btn  = document.getElementById('ttsBtn');
    var menu = document.getElementById('ttsMenu');
    if (!TTS.supported) { pick.hidden = true; return; }  // 不支援就整組隱藏，其餘功能不受影響

    function setOpen(o){
      pick.dataset.open = o ? '1' : '0';
      menu.hidden = !o;
      btn.setAttribute('aria-expanded', o ? 'true' : 'false');
    }
    var MODES = [
      { key:'digest', name:'本期重點整理', hint:'開頭重點＋各則標題' },
      { key:'all',    name:'各主題詳讀',   hint:'全部主題依序朗讀，可隨時停止' }
    ];
    function buildMenu(){
      menu.innerHTML = '';
      MODES.forEach(function(m){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'dpick-item';
        b.innerHTML = '▶ ' + m.name + '<span class="dpick-count"> 約 ' + TTS.estimate(m.key) + ' 分</span>' +
                      '<br><span class="tts-hint">' + m.hint + '</span>';
        b.addEventListener('click', function(){ setOpen(false); TTS[m.key](btn); });
        menu.appendChild(b);
      });
      var tip = document.createElement('div');
      tip.className = 'tts-hint tts-tip';
      tip.textContent = '單則朗讀：點各則標題旁的 ▶';
      menu.appendChild(tip);
    }
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      if (TTS.playing()) { TTS.stop(); setOpen(false); return; }   // 播放中＝停止鍵
      if (pick.dataset.open === '1') { setOpen(false); return; }
      buildMenu(); setOpen(true);
    });
    document.addEventListener('click', function(e){ if (!pick.contains(e.target)) setOpen(false); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') setOpen(false); });
    document.getElementById('tpToggle').addEventListener('click', TTS.toggle);
    document.getElementById('tpStop').addEventListener('click', TTS.stop);
    var rateSel = document.getElementById('tpRate');
    rateSel.value = String(TTS.rate());
    rateSel.addEventListener('change', function(){ TTS.setRate(rateSel.value); });
    window.addEventListener('beforeunload', TTS.stop);   // 離開頁面不要繼續唸
  })();

  window.addEventListener('resize', updateEdges);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
})();
</script>
</body>
</html>
